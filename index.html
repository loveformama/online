<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON GRID: Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Interactive Ambient Particles Background -->
  <canvas id="canvas-particles"></canvas>

  <div class="game-container">
    <!-- Top Status & Profile Bar -->
    <div class="top-bar">
      <div class="connection-status offline" id="connection-status">
        <span class="status-dot"></span>
        <span class="status-text">ВНЕ СЕТИ</span>
      </div>
      
      <div class="profile-widget">
        <!-- Google Login Button -->
        <button class="btn-login" id="btn-login-google">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114A5.94 5.94 0 0 1 8 12.571a5.94 5.94 0 0 1 5.99-5.943c1.55 0 2.97.572 4.07 1.505l3.07-3.07C19.23 3.324 16.79 2 13.99 2 8.47 2 4 6.471 4 12c0 5.529 4.47 10 9.99 10 5.76 0 9.77-3.952 9.77-9.81 0-.619-.05-1.219-.15-1.905z"/>
          </svg>
          <span>Войти</span>
        </button>

        <!-- Authenticated Profile Display -->
        <div class="user-profile hidden" id="user-profile">
          <span class="user-name" id="user-name">Игрок</span>
          <div class="user-avatar" id="btn-open-profile" title="Настройки профиля">
            <div class="avatar-glow" id="user-avatar-glow"></div>
            <img src="" id="user-avatar-img" class="avatar-img hidden" alt="Avatar">
            <div id="user-avatar-placeholder" class="avatar-placeholder">X</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Header -->
    <header class="game-header">
      <h1 class="game-title" id="main-title">Neon Grid</h1>
      <p class="game-subtitle" id="main-subtitle">Крестики-Нолики из Будущего</p>
    </header>

    <!-- Controls Panel -->
    <section class="controls-panel">
      <div class="control-row">
        <!-- Game Mode Selection -->
        <div class="btn-group btn-group-cyan">
          <button class="control-btn active" id="mode-bot" data-mode="bot">Против Бота</button>
          <button class="control-btn" id="mode-local" data-mode="local">Локально (2P)</button>
        </div>
        
        <!-- Sound Control Button -->
        <button class="action-btn-small sound-btn" id="sound-toggle" title="Вкл/Выкл Звук">
          <!-- Speaker Icons (On / Off) -->
          <svg class="sound-on-icon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="sound-off-icon" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>

      <!-- Bot Difficulty Selection (Only visible when playing vs Bot) -->
      <div class="control-row" id="difficulty-row">
        <div class="btn-group">
          <button class="control-btn" data-diff="easy">Легко</button>
          <button class="control-btn active" data-diff="medium">Средне</button>
          <button class="control-btn" data-diff="hard">Нереально</button>
        </div>
      </div>
    </section>

    <!-- Scoreboard -->
    <section class="scoreboard">
      <div class="score-item score-p1">
        <span class="score-label" id="p1-label">Игрок (X)</span>
        <span class="score-val" id="score-x">0</span>
      </div>
      <div class="score-item score-draw">
        <span class="score-label">Ничьи</span>
        <span class="score-val" id="score-ties">0</span>
      </div>
      <div class="score-item score-p2">
        <span class="score-label" id="p2-label">Бот (O)</span>
        <span class="score-val" id="score-o">0</span>
      </div>
    </section>

    <!-- Active Turn Status -->
    <div class="turn-status x-turn" id="turn-indicator">
      <span class="turn-dot"></span>
      <span class="turn-text" id="turn-text">Ваш ход (X)</span>
    </div>

    <!-- Board -->
    <main class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </main>

    <!-- Footer Actions -->
    <footer class="footer-panel">
      <button class="btn-primary" id="btn-reset">
        <svg viewBox="0 0 24 24">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        <span>Сбросить счет</span>
      </button>
    </footer>
  </div>

  <!-- End Game Alert Modal -->
  <div class="modal-overlay" id="endgame-modal">
    <div class="modal-content" id="modal-container">
      <div class="modal-icon-container" id="modal-icon-wrapper">
        <svg viewBox="0 0 100 100" id="modal-icon">
          <!-- Dynamic SVG content loaded by js -->
        </svg>
      </div>
      <h2 class="modal-title" id="modal-result-title">ПОБЕДА!</h2>
      <p class="modal-body" id="modal-result-body">Игрок X одержал сокрушительную победу над искусственным интеллектом.</p>
      
      <div class="modal-actions">
        <button class="btn-modal-primary" id="btn-rematch">Реванш</button>
        <button class="btn-modal-secondary" id="btn-close-modal">В главное меню</button>
      </div>
    </div>
  </div>

  <!-- Profile Customization Modal -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-content profile-modal-content">
      <h2 class="modal-title">Профиль Игрока</h2>
      <p class="modal-body" style="margin-bottom: 15px;">Настройте свой никнейм и кибер-аватар для Neon Grid.</p>
      
      <div class="profile-form">
        <div class="input-group">
          <label class="input-label" for="input-nickname">Никнейм</label>
          <input type="text" id="input-nickname" class="text-input" placeholder="Введите ник..." maxlength="12">
        </div>

        <label class="input-label" style="display: block; margin-top: 15px; margin-bottom: 8px;">Выберите Аватар</label>
        <div class="avatar-grid" id="avatar-grid">
          <div class="avatar-opt" data-avatar-id="cyber-ninja" title="Cyber Ninja">
            <span class="avatar-opt-char">🥷</span>
          </div>
          <div class="avatar-opt" data-avatar-id="synth-wave" title="Synthwave Core">
            <span class="avatar-opt-char">🌅</span>
          </div>
          <div class="avatar-opt" data-avatar-id="byte-hex" title="Byte Hex">
            <span class="avatar-opt-char">🤖</span>
          </div>
          <div class="avatar-opt" data-avatar-id="neon-hacker" title="Neon Hacker">
            <span class="avatar-opt-char">💻</span>
          </div>
          <div class="avatar-opt" data-avatar-id="laser-phoenix" title="Laser Phoenix">
            <span class="avatar-opt-char">🐦</span>
          </div>
          <div class="avatar-opt" data-avatar-id="google-photo" id="google-avatar-opt" title="Google Photo">
            <span class="avatar-opt-char">🌐</span>
          </div>
        </div>
      </div>
      
      <div class="modal-actions" style="margin-top: 20px;">
        <button class="btn-modal-primary" id="btn-save-profile">Сохранить</button>
        <button class="btn-modal-secondary btn-logout" id="btn-logout" style="border-color: rgba(255, 0, 127, 0.3); color: var(--color-magenta);">Выйти из сети</button>
        <button class="btn-modal-secondary" id="btn-close-profile">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toast">
    <span class="toast-dot"></span>
    <span class="toast-text" id="toast-message">Режим игры обновлен!</span>
  </div>

  <!-- Scripts -->
  <script src="app.js" type="module"></script>
</body>
</html>
